name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KTLINT_VERSION: '1.5.0'
  KTLINT_SHA256: a16be01dcc480aab2f55f444b620142152f66e31564b3b9376506d624c28a2ad
  DETEKT_VERSION: '1.23.8'
  DETEKT_SHA256: 2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1

jobs:
  lint:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned linters
        run: |
          set -euo pipefail
          curl -sSLf -o ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          curl -sSLf -o detekt-cli.jar "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}-all.jar"
          printf '%s  ktlint\n%s  detekt-cli.jar\n' "$KTLINT_SHA256" "$DETEKT_SHA256" | sha256sum -c -
      - name: ktlint
        run: java -jar ktlint --relative "app/src/**/*.kt" "*.kts" "app/*.kts"
      - name: detekt
        run: java -jar detekt-cli.jar --input app/src/main/java,app/src/test/java --build-upon-default-config --config config/detekt/detekt.yml --report html:build/detekt.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: build/detekt.html
          if-no-files-found: ignore

  test:
    name: Unit + Robolectric tests, Kover coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
      - name: Tests and coverage
        run: gradle --no-daemon testDebugUnitTest koverXmlReportDebug koverHtmlReportDebug
      - name: Coverage summary
        if: always()
        run: python3 .github/scripts/coverage_summary.py app/build/reports/kover/reportDebug.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/kover/
          if-no-files-found: ignore

  build:
    name: Debug + release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-setup
      - name: Assemble (release is unsigned without tag secrets)
        run: gradle --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: S23-Optimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
