name: CodeQL
on:
  push:
    branches: [main, 'upgrade/**']
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
      - name: Build for CodeQL
        # The Kotlin extractor needs a real, in-process compile: no build cache, no Kotlin daemon.
        run: gradle --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process assembleDebug
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
