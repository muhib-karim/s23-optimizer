name: Android build and release
# Branch builds, tests and lint run in ci.yml; this workflow only turns a vMAJOR.MINOR.PATCH tag into a signed release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup
      - name: JVM tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: S23-Optimizer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: JVM-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag'; exit 1; }
          test -n "$SIGNING_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SIGNING_STORE_FILE"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          gradle --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/S23-Optimizer-${GITHUB_REF_NAME}.apk"
          cd dist
          sha256sum "S23-Optimizer-${GITHUB_REF_NAME}.apk" > "S23-Optimizer-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: S23-Optimizer-release
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/*.sha256 --verify-tag --title "S23 Optimizer $GITHUB_REF_NAME" --generate-notes
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
